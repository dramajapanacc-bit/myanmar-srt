<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myanmar SRT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d10;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  margin:8px 0 20px;
  font-size:27px;
}

.card{
  background:#15181d;
  border:1px solid #292e36;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:13px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
  color:#bfc5ce;
  font-size:14px;
}

input,button{
  width:100%;
  min-height:46px;
  border-radius:11px;
  border:1px solid #343a44;
  background:#0e1115;
  color:#fff;
  padding:10px 12px;
  font-size:15px;
}

input[type="file"]{
  padding:11px;
}

button{
  margin-top:10px;
  background:#242a33;
  cursor:pointer;
  font-weight:bold;
}

button:hover{background:#303743}

.primary{
  background:#2563eb;
  border-color:#2563eb;
}

.primary:hover{background:#1d4ed8}

.danger{
  background:#991b1b;
  border-color:#991b1b;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#0d1117;
  color:#cbd5e1;
  margin-top:12px;
  line-height:1.5;
  white-space:pre-wrap;
}

.small{
  color:#9ca3af;
  font-size:13px;
  line-height:1.5;
}

textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  border-radius:11px;
  border:1px solid #343a44;
  background:#0b0e12;
  color:#fff;
  padding:12px;
  font-size:14px;
  line-height:1.6;
}

.hidden{display:none}

.download{
  display:block;
  text-align:center;
  text-decoration:none;
  padding:14px;
  margin-top:12px;
  border-radius:11px;
  background:#16a34a;
  color:#fff;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🇲🇲 Myanmar SRT</h1>

<!-- ================= API SETTINGS ================= -->

<div class="card">

  <div class="title">🔑 API Settings</div>

  <label>Groq API Key</label>

  <input
    id="groqKey"
    type="password"
    placeholder="Enter Groq API Key"
  >

  <label>Gemini API Key</label>

  <input
    id="geminiKey"
    type="password"
    placeholder="Enter Gemini API Key"
  >

  <button onclick="saveKeys()">
    💾 Save API Keys
  </button>

  <button class="danger" onclick="clearKeys()">
    🗑️ Clear Saved Keys
  </button>

  <div class="small">
    API Key တွေကို ဒီ browser ရဲ့ local storage ထဲမှာပဲ သိမ်းထားပါတယ်။
  </div>

</div>


<!-- ================= SRT ================= -->

<div class="card">

  <div class="title">🇲🇲 SRT</div>

  <div class="small">
    Video → Groq Transcript → Gemini Myanmar Translation → Actual Timing SRT
  </div>

  <!-- VIDEO -->

  <label>🎬 Original Video</label>

  <input
    id="videoFile"
    type="file"
    accept="video/*"
  >

  <div class="small">
    Maximum 300MB / 5 minutes
  </div>

  <button
    class="primary"
    onclick="transcribe()"
  >
    🎙️ Groq Transcript
  </button>

  <button
    class="primary"
    onclick="translateMyanmar()"
  >
    🇲🇲 Gemini Myanmar Translation
  </button>

  <!-- STATUS -->

  <div class="title" style="margin-top:18px;">
    📊 Status
  </div>

  <div
    id="status"
    class="status"
  >Ready</div>

  <!-- ORIGINAL -->

  <div class="title" style="margin-top:18px;">
    📝 Original Transcript
  </div>

  <textarea
    id="originalText"
    readonly
    placeholder="Transcript ရလာပါမယ်..."
  ></textarea>

  <!-- MYANMAR -->

  <div class="title" style="margin-top:18px;">
    🇲🇲 Myanmar Subtitle
  </div>

  <textarea
    id="myanmarText"
    readonly
    placeholder="Myanmar Subtitle ရလာပါမယ်..."
  ></textarea>

  <button onclick="downloadSrt()">
    ⬇️ Download Myanmar SRT
  </button>

</div>

</div>


<script>

/* =================================================
   GLOBAL
================================================= */

let originalTranscript = [];
let myanmarTranscript = [];


/* =================================================
   API KEY
================================================= */

function loadKeys(){

  document.getElementById("groqKey").value =
    localStorage.getItem("myanmar_srt_groq_key") || "";

  document.getElementById("geminiKey").value =
    localStorage.getItem("myanmar_srt_gemini_key") || "";

}


function saveKeys(){

  const groq =
    document.getElementById("groqKey").value.trim();

  const gemini =
    document.getElementById("geminiKey").value.trim();

  localStorage.setItem(
    "myanmar_srt_groq_key",
    groq
  );

  localStorage.setItem(
    "myanmar_srt_gemini_key",
    gemini
  );

  setStatus("✅ API Keys သိမ်းပြီးပါပြီ");

}


function clearKeys(){

  localStorage.removeItem(
    "myanmar_srt_groq_key"
  );

  localStorage.removeItem(
    "myanmar_srt_gemini_key"
  );

  document.getElementById("groqKey").value = "";
  document.getElementById("geminiKey").value = "";

  setStatus("🗑️ API Keys ဖျက်ပြီးပါပြီ");

}


function getGroqKey(){

  return (
    localStorage.getItem(
      "myanmar_srt_groq_key"
    ) || ""
  );

}


function getGeminiKey(){

  return (
    localStorage.getItem(
      "myanmar_srt_gemini_key"
    ) || ""
  );

}


/* =================================================
   STATUS
================================================= */

function setStatus(message){

  document.getElementById("status").textContent =
    message;

}


/* =================================================
   GROQ TRANSCRIPT
================================================= */

async function transcribe(){

  const file =
    document.getElementById("videoFile").files[0];

  if(!file){

    setStatus("❌ Video ရွေးပေးပါ");
    return;

  }


  const key = getGroqKey();

  if(!key){

    setStatus("❌ Groq API Key ထည့်ပေးပါ");
    return;

  }


  if(
    file.size >
    300 * 1024 * 1024
  ){

    setStatus(
      "❌ Video က 300MB ထက်ကြီးနေပါတယ်"
    );

    return;

  }


  setStatus(
    "⏳ Groq Transcript လုပ်နေပါတယ်..."
  );


  const formData = new FormData();

  formData.append(
    "video",
    file
  );


  try{

    const response =
      await fetch(
        "/api/transcribe",
        {
          method:"POST",

          headers:{
            "x-groq-api-key":key
          },

          body:formData
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Groq Error"
      );

    }


    originalTranscript =
      data.transcript || [];


    document.getElementById(
      "originalText"
    ).value =
      makeDisplayText(
        originalTranscript
      );


    if(!originalTranscript.length){

      setStatus(
        "❌ Transcript စာမရပါ။ Video အသံကို စစ်ပေးပါ။"
      );

      return;

    }


    setStatus(
      "✅ Groq Transcript ရပါပြီ။ အခု Gemini Myanmar Translation ကိုနှိပ်ပါ။"
    );


  }catch(error){

    setStatus(
      "❌ Groq Error: " +
      error.message
    );

  }

}


/* =================================================
   GEMINI MYANMAR TRANSLATION
================================================= */

async function translateMyanmar(){

  if(!originalTranscript.length){

    setStatus(
      "❌ အရင် Groq Transcript လုပ်ပါ"
    );

    return;

  }


  const key = getGeminiKey();

  if(!key){

    setStatus(
      "❌ Gemini API Key ထည့်ပေးပါ"
    );

    return;

  }


  setStatus(
    "⏳ Gemini Myanmar Translation လုပ်နေပါတယ်..."
  );


  try{

    const response =
      await fetch(
        "/api/translate",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "x-gemini-api-key":
              key
          },

          body:JSON.stringify({
            transcript:
              originalTranscript
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Gemini Error"
      );

    }


    myanmarTranscript =
      data.transcript || [];


    document.getElementById(
      "myanmarText"
    ).value =
      makeDisplayText(
        myanmarTranscript
      );


    if(!myanmarTranscript.length){

      setStatus(
        "❌ Myanmar Subtitle မရပါ။"
      );

      return;

    }


    setStatus(
      "✅ Myanmar Translation ရပါပြီ။ အခု Download Myanmar SRT ကိုနှိပ်ပါ။"
    );


  }catch(error){

    setStatus(
      "❌ Gemini Error: " +
      error.message
    );

  }

}


/* =================================================
   DISPLAY
================================================= */

function makeDisplayText(transcript){

  return transcript
    .map(
      (item,index) => {

        return (
          `${index + 1}\n` +
          `${formatSrtTime(item.start)} --> ` +
          `${formatSrtTime(item.end)}\n` +
          `${item.text}\n`
        );

      }
    )
    .join("\n");

}


/* =================================================
   SRT TIME
================================================= */

function formatSrtTime(seconds){

  const totalMs =
    Math.round(
      Number(seconds) * 1000
    );


  const hours =
    Math.floor(
      totalMs / 3600000
    );


  const minutes =
    Math.floor(
      (totalMs % 3600000) /
      60000
    );


  const secs =
    Math.floor(
      (totalMs % 60000) /
      1000
    );


  const ms =
    totalMs % 1000;


  return (
    String(hours).padStart(2,"0") +
    ":" +
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0") +
    "," +
    String(ms).padStart(3,"0")
  );

}


/* =================================================
   DOWNLOAD SRT
================================================= */

function downloadSrt(){

  if(!myanmarTranscript.length){

    setStatus(
      "❌ Myanmar subtitle မရှိသေးပါ"
    );

    return;

  }


  const srt =
    myanmarTranscript
      .map(
        (item,index) => {

          return (
            `${index + 1}\n` +
            `${formatSrtTime(item.start)} --> ` +
            `${formatSrtTime(item.end)}\n` +
            `${item.text}\n`
          );

        }
      )
      .join("\n");


  const blob =
    new Blob(
      [srt],
      {
        type:
          "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "myanmar-subtitle.srt";


  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );


  setStatus(
    "✅ Myanmar SRT Download လုပ်ပြီးပါပြီ"
  );

}


/* =================================================
   START
================================================= */

loadKeys();

</script>

</body>
</html>
