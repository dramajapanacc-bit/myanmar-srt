<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Myanmar SRT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1115;
      color: #ffffff;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: #181b22;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #292d36;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #101217;
      color: white;
      border: 1px solid #333;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 9px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .translate-btn {
      background: #16a085;
    }

    .download-btn {
      background: #e67e22;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      background: #101217;
      border-radius: 8px;
      color: #aaa;
      white-space: pre-wrap;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .subtitle-box {
      background: #101217;
      border-radius: 8px;
      padding: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .line {
      padding: 10px 5px;
      border-bottom: 1px solid #292d36;
    }

    .time {
      color: #8e9cff;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .text {
      font-size: 15px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    .info {
      color: #999;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Myanmar SRT</h1>

  <div class="subtitle">
    Groq Transcript → Gemini Myanmar Translation
  </div>

  <div class="card">

    <label>Video File</label>

    <input
      type="file"
      id="videoInput"
      accept="video/*"
    >

    <div class="info">
      Maximum: 100MB / 5 minutes
    </div>

    <button id="transcribeBtn">
      🎙️ Groq Transcript
    </button>

    <button
      id="translateBtn"
      class="translate-btn"
      disabled
    >
      🇲🇲 Gemini မြန်မာဘာသာပြန်
    </button>

    <div
      id="status"
      class="status"
    >
      Ready
    </div>

  </div>


  <!-- ORIGINAL TRANSCRIPT -->

  <div
    id="originalSection"
    class="card hidden"
  >

    <div class="section-title">
      📝 Original Transcript
    </div>

    <div
      id="originalBox"
      class="subtitle-box"
    ></div>

    <button
      id="downloadOriginalBtn"
      class="download-btn"
    >
      ⬇️ Original SRT Download
    </button>

  </div>


  <!-- MYANMAR TRANSLATION -->

  <div
    id="myanmarSection"
    class="card hidden"
  >

    <div class="section-title">
      🇲🇲 Myanmar Translation
    </div>

    <div
      id="myanmarBox"
      class="subtitle-box"
    ></div>

    <button
      id="downloadMyanmarBtn"
      class="download-btn"
    >
      ⬇️ Myanmar SRT Download
    </button>

  </div>

</div>


<script>

  const videoInput =
    document.getElementById("videoInput");

  const transcribeBtn =
    document.getElementById("transcribeBtn");

  const translateBtn =
    document.getElementById("translateBtn");

  const status =
    document.getElementById("status");

  const originalSection =
    document.getElementById("originalSection");

  const myanmarSection =
    document.getElementById("myanmarSection");

  const originalBox =
    document.getElementById("originalBox");

  const myanmarBox =
    document.getElementById("myanmarBox");

  const downloadOriginalBtn =
    document.getElementById("downloadOriginalBtn");

  const downloadMyanmarBtn =
    document.getElementById("downloadMyanmarBtn");


  let originalTranscript = [];
  let myanmarTranscript = [];


  function setStatus(message) {
    status.textContent = message;
  }


  function formatTime(seconds) {

    seconds = Number(seconds || 0);

    const hours =
      Math.floor(seconds / 3600);

    const minutes =
      Math.floor((seconds % 3600) / 60);

    const secs =
      Math.floor(seconds % 60);

    const ms =
      Math.floor((seconds % 1) * 1000);

    return (
      String(hours).padStart(2, "0") +
      ":" +
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0") +
      "," +
      String(ms).padStart(3, "0")
    );
  }


  function createSRT(segments) {

    return segments.map((item, index) => {

      return (
        (index + 1) +
        "\n" +
        formatTime(item.start) +
        " --> " +
        formatTime(item.end) +
        "\n" +
        item.text +
        "\n\n"
      );

    }).join("");

  }


  function showTranscript(box, segments) {

    box.innerHTML = "";

    segments.forEach((item, index) => {

      const div =
        document.createElement("div");

      div.className = "line";

      div.innerHTML = `
        <div class="time">
          ${index + 1}.
          ${formatTime(item.start)}
          →
          ${formatTime(item.end)}
        </div>

        <div class="text">
          ${escapeHtml(item.text)}
        </div>
      `;

      box.appendChild(div);

    });

  }


  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  function downloadText(filename, text) {

    const blob =
      new Blob(
        [text],
        {
          type: "text/plain;charset=utf-8"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

  }


  // GROQ TRANSCRIPTION

  transcribeBtn.addEventListener(
    "click",
    async () => {

      const file =
        videoInput.files[0];

      if (!file) {

        setStatus(
          "⚠️ Video file ရွေးပေးပါ"
        );

        return;
      }


      if (file.size > 100 * 1024 * 1024) {

        setStatus(
          "⚠️ Video size က 100MB ထက်ကျော်နေပါတယ်"
        );

        return;
      }


      transcribeBtn.disabled = true;

      translateBtn.disabled = true;

      setStatus(
        "⏳ Groq က Video ကို စာသားအဖြစ် ပြောင်းနေပါတယ်..."
      );


      try {

        const formData =
          new FormData();

        formData.append(
          "video",
          file
        );


        const response =
          await fetch(
            "/api/transcribe",
            {
              method: "POST",
              body: formData
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Groq transcription failed"
          );

        }


        originalTranscript =
          data.transcript || [];


        if (!originalTranscript.length) {

          throw new Error(
            "Transcript မရပါ"
          );

        }


        showTranscript(
          originalBox,
          originalTranscript
        );


        originalSection.classList.remove(
          "hidden"
        );


        translateBtn.disabled = false;


        setStatus(
          "✅ Groq Transcript ရပါပြီ။\n\n" +
          "အခု Gemini မြန်မာဘာသာပြန် ခလုတ်ကို နှိပ်ပါ။"
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "❌ Error: " +
          error.message
        );

      } finally {

        transcribeBtn.disabled = false;

      }

    }
  );


  // GEMINI TRANSLATION

  translateBtn.addEventListener(
    "click",
    async () => {

      if (!originalTranscript.length) {

        setStatus(
          "⚠️ အရင်ဆုံး Groq Transcript လုပ်ပါ"
        );

        return;

      }


      translateBtn.disabled = true;

      setStatus(
        "⏳ Gemini က မြန်မာဘာသာပြန်နေပါတယ်...\n" +
        "ခဏစောင့်ပေးပါ။"
      );


      try {

        const response =
          await fetch(
            "/api/translate",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                transcript:
                  originalTranscript
              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Gemini translation failed"
          );

        }


        myanmarTranscript =
          data.transcript ||
          data.segments ||
          [];


        if (!myanmarTranscript.length) {

          throw new Error(
            "မြန်မာဘာသာပြန်စာ မရပါ"
          );

        }


        showTranscript(
          myanmarBox,
          myanmarTranscript
        );


        myanmarSection.classList.remove(
          "hidden"
        );


        setStatus(
          "✅ Gemini မြန်မာဘာသာပြန် ပြီးပါပြီ။\n\n" +
          "Myanmar SRT ကို Download လုပ်နိုင်ပါပြီ။"
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "❌ Gemini Error: " +
          error.message
        );

      } finally {

        translateBtn.disabled = false;

      }

    }
  );


  // ORIGINAL SRT DOWNLOAD

  downloadOriginalBtn.addEventListener(
    "click",
    () => {

      if (!originalTranscript.length) {
        return;
      }

      const srt =
        createSRT(
          originalTranscript
        );

      downloadText(
        "Original_Transcript.srt",
        srt
      );

    }
  );


  // MYANMAR SRT DOWNLOAD

  downloadMyanmarBtn.addEventListener(
    "click",
    () => {

      if (!myanmarTranscript.length) {
        return;
      }

      const srt =
        createSRT(
          myanmarTranscript
        );

      downloadText(
        "Myanmar_Subtitle.srt",
        srt
      );

    }
  );

</script>

</body>
</html>
